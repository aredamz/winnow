[project]
name = "winnow"
version = "0.0.0"
description = "An autonomous review-and-docs crew for your repository, powered by Meta's Muse Spark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Winnow" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.55",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "chromadb>=0.6",
    "fastembed>=0.5",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.7",
    "unidiff>=0.7",
    "httpx>=0.28",
    "PyJWT>=2.10",
    "typer>=0.15",
    "rich>=13.9",
    "jinja2>=3.1",
    "sse-starlette>=2.2",
    "structlog>=24.4",
    "detect-secrets>=1.5",
    "tiktoken>=0.8",
    "pathspec>=1.1.1",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "pyright>=1.1",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[project.scripts]
winnow = "winnow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607", "S105", "S106"]
"scripts/**/*.py" = ["S101"]
"eval/**/*.py" = ["S101", "S603", "S607"]

[tool.pyright]
typeCheckingMode = "basic"
executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "tests", extraPaths = ["src"] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-sources]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
# No third-party LLM providers. All inference goes through LLMClient -> Meta Model API (FR-30).
