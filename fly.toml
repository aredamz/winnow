app = "winnow-prod"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "winnow_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[env]
  WINNOW_DATA_DIR = "/data"
  WINNOW_MODEL = "muse-spark-1.3"
  WINNOW_DAILY_SPEND_USD = "20"
  WINNOW_LOG_PROMPTS = "0"
  WINNOW_WORKERS = "2"
